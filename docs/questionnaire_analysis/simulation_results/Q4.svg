<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="100%" height="100%" fill="white"/>
<text x="700" y="35" font-family="SimSun,serif" font-size="32" dominant-baseline="central" text-anchor="middle">Q4 选项分布｜有创作经历（A/B/C）</text>
<text x="700" y="80" font-family="SimSun,serif" font-size="30" dominant-baseline="central" text-anchor="middle">模拟数据，仅供流程测试</text>
<text x="20" y="150" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">A. 缺少灵感，容易卡文</text>
<rect x="750" y="131" width="450.0" height="38" fill="#ccc" stroke="black"/>
<text x="1210.0" y="150" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">12（66.67%）</text>
<text x="20" y="215" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">B. 不知道如何推进后续剧情</text>
<rect x="750" y="196" width="337.5" height="38" fill="#ccc" stroke="black"/>
<text x="1097.5" y="215" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">9（50.0%）</text>
<text x="20" y="280" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">C. 人物性格、关系等设定难以管理</text>
<rect x="750" y="261" width="375.0" height="38" fill="#ccc" stroke="black"/>
<text x="1135.0" y="280" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">10（55.56%）</text>
<text x="20" y="345" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">D. 长篇创作容易出现前后情节矛盾</text>
<rect x="750" y="326" width="262.5" height="38" fill="#ccc" stroke="black"/>
<text x="1022.5" y="345" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">7（38.89%）</text>
<text x="20" y="410" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">E. 章节、正文及创作资料管理不方便</text>
<rect x="750" y="391" width="300.0" height="38" fill="#ccc" stroke="black"/>
<text x="1060.0" y="410" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">8（44.44%）</text>
<text x="20" y="475" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">F. 难以保持稳定的写作习惯</text>
<rect x="750" y="456" width="450.0" height="38" fill="#ccc" stroke="black"/>
<text x="1210.0" y="475" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">12（66.67%）</text>
<text x="20" y="540" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">G. 暂时没有明显困难</text>
<rect x="750" y="521" width="37.5" height="38" fill="#ccc" stroke="black"/>
<text x="797.5" y="540" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">1（5.56%）</text>
<text x="20" y="605" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="start">H. 其他（请填写）</text>
<rect x="750" y="586" width="375.0" height="38" fill="#ccc" stroke="black"/>
<text x="1135.0" y="605" font-family="SimSun,serif" font-size="23" dominant-baseline="central" text-anchor="start">10（55.56%）</text>
<line x1="750" y1="120" x2="750" y2="640" stroke="black"/>
<line x1="750" y1="640" x2="1200" y2="640" stroke="black"/>
<line x1="750.0" y1="640" x2="750.0" y2="647" stroke="black"/>
<text x="750.0" y="665" font-family="SimSun,serif" font-size="22" dominant-baseline="central" text-anchor="middle">0</text>
<line x1="975.0" y1="640" x2="975.0" y2="647" stroke="black"/>
<text x="975.0" y="665" font-family="SimSun,serif" font-size="22" dominant-baseline="central" text-anchor="middle">6</text>
<line x1="1200.0" y1="640" x2="1200.0" y2="647" stroke="black"/>
<text x="1200.0" y="665" font-family="SimSun,serif" font-size="22" dominant-baseline="central" text-anchor="middle">12</text>
<text x="975.0" y="700" font-family="SimSun,serif" font-size="24" dominant-baseline="central" text-anchor="middle">选择人数（人）</text>
<text x="700" y="760" font-family="SimSun,serif" font-size="25" dominant-baseline="central" text-anchor="middle">模拟数据，仅供流程测试；有效答题人数 n=18</text>
<text x="700" y="795" font-family="SimSun,serif" font-size="24" dominant-baseline="central" text-anchor="middle">百分比分母为本题有效答题人数；多选百分比合计可超过100%。</text>
</svg>